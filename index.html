<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Secretaria de Missões IDPB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: secretaria clássica — barra amarela no topo, menu lateral cinza, área de trabalho com blocos-atalho e fichas */
:root{
  --sun:#FDD66B; --sun-deep:#F2BE2E; --sun-ink:#3A2E06;
  --side:#A4ABB5; --side-ink:#2B2F36; --side-hover:#959DA9;
  --bg:#F6F5F1; --panel:#E4E7EC; --card:#FFFFFF; --fg:#24272C; --muted:#646B76; --line:#D3D7DE;
  --ok:#2E7D4F; --ok-bg:#E2F2E8; --warn:#9A5B00; --warn-bg:#FFF0D1; --bad:#A33A2C; --bad-bg:#FBE4E0; --info:#2B5C8A; --info-bg:#E2ECF6;
  --display:"Lexend",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
  --shadow:0 3px 8px rgba(40,35,10,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sun:#E9BE45; --sun-deep:#D6A626; --sun-ink:#2A2003;
  --side:#2C3038; --side-ink:#D9DDE3; --side-hover:#383D47;
  --bg:#17191D; --panel:#1F2228; --card:#272B32; --fg:#E9EBEE; --muted:#A3AAB4; --line:#3A3F48;
  --ok:#7FD3A0; --ok-bg:#1D3326; --warn:#F4C46B; --warn-bg:#3A2D12; --bad:#F0998C; --bad-bg:#3D211D; --info:#93BFEA; --info-bg:#1C2B3B;
  --shadow:0 3px 10px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --sun:#E9BE45; --sun-deep:#D6A626; --sun-ink:#2A2003;
  --side:#2C3038; --side-ink:#D9DDE3; --side-hover:#383D47;
  --bg:#17191D; --panel:#1F2228; --card:#272B32; --fg:#E9EBEE; --muted:#A3AAB4; --line:#3A3F48;
  --ok:#7FD3A0; --ok-bg:#1D3326; --warn:#F4C46B; --warn-bg:#3A2D12; --bad:#F0998C; --bad-bg:#3D211D; --info:#93BFEA; --info-bg:#1C2B3B;
  --shadow:0 3px 10px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sun)}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column}
.who{background:var(--sun);color:var(--sun-ink);display:flex;gap:12px;align-items:center;padding:18px 18px 18px max(18px,env(safe-area-inset-left,0px));min-height:76px;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.who svg{flex:none}
.who small{display:block;font-size:13px;opacity:.8}
.who b{font-weight:600}
.nav{display:flex;flex-direction:column;padding:18px 10px;gap:2px;position:sticky;top:env(safe-area-inset-top,0px)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:6px;color:inherit;text-decoration:none;font-size:16px}
.nav a:hover{background:var(--side-hover)}
.nav a[aria-current="page"]{background:var(--side-hover);font-weight:600}
.nav svg{width:19px;height:19px;flex:none}
.nav .count{margin-left:auto;font-size:12px;background:var(--sun);color:var(--sun-ink);border-radius:20px;padding:1px 8px;font-weight:600}
/* top */
.top{background:var(--sun);color:var(--sun-ink);display:flex;align-items:center;gap:16px;min-height:76px;padding-block:10px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.burger{background:none;border:0;padding:6px;cursor:pointer;display:none}
.top .search{flex:1;max-width:460px;margin-left:auto;position:relative}
.top input{width:100%;padding:10px 14px 10px 38px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.75);font:inherit;color:#24272C}
.top .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}
.seal{width:44px;height:44px;border-radius:50%;border:2px solid var(--sun-ink);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.04em;flex:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:40}
.results a{display:block;padding:9px 14px;color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.results a:hover,.results a.sel{background:var(--panel)}
.results small{color:var(--muted)}
main{padding-block:16px 40px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
/* panel like model */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:18px}
.panel-head{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.panel-head h1{font-size:24px;flex:1 1 260px}
.panel-head p{margin:2px 0 0;color:var(--muted);font-size:14px;flex-basis:100%}
.panel-body{padding:24px 26px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:9px 18px;border:1px solid var(--line);border-radius:3px;background:var(--side);color:var(--side-ink);cursor:pointer;text-decoration:none;font-size:15px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.btn:hover{filter:brightness(.95)}
.btn.y{background:var(--sun);color:var(--sun-ink);border-color:var(--sun-deep)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px}
.tile{background:var(--sun);color:var(--sun-ink);box-shadow:var(--shadow);min-height:86px;padding:16px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;text-decoration:none;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile span.t{text-decoration:underline;display:inline-flex;gap:8px;align-items:center;font-size:16px}
.tile small{font-size:12.5px;opacity:.75}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
/* filters & table */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:end}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;gap:4px}
.filters select,.filters input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--fg);min-width:150px;max-width:100%}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--panel);position:sticky;top:0;cursor:pointer;user-select:none}
th.num,td.num{text-align:right}
tbody tr:hover{background:var(--panel)}
td a{color:inherit;font-weight:600;text-decoration:none}
td a:hover{text-decoration:underline}
tfoot td{font-weight:700;background:var(--panel)}
.pill{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12.5px;font-weight:600}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mute{background:var(--panel);color:var(--muted)}
.bar{height:8px;background:var(--panel);border-radius:4px;min-width:60px;width:90px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun-deep)}
/* profile */
.prof{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 20px;min-width:0}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:var(--body);font-weight:700;margin-bottom:10px}
dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;margin:0}
dt{color:var(--muted);font-size:14px}
dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.idhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-family:var(--display);font-size:26px;font-weight:600;flex:none}
.idhead h1{font-size:26px}
.idhead .sub{color:var(--muted)}
.copy{background:none;border:1px solid var(--line);border-radius:4px;padding:1px 8px;font-size:12px;cursor:pointer;margin-left:6px;color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:8px 12px;font-size:14px}
.notes{display:flex;flex-direction:column;gap:8px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.group h2{font-size:18px}
.group .meta{color:var(--muted);font-size:13.5px;margin:2px 0 12px}
.group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.group li a{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.group li a:hover b{text-decoration:underline}
.group li small{color:var(--muted);text-align:right}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:6px;font-size:14px;z-index:50}
.muted{color:var(--muted)}
.scrim{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,85vw);z-index:45;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);overflow:auto}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:44}
  .burger{display:block}
  .top{padding-left:max(12px,env(safe-area-inset-left,0px));gap:10px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .prof{grid-template-columns:minmax(0,1fr)}
  dl{grid-template-columns:120px minmax(0,1fr)}
  .panel-head,.panel-body{padding:16px}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .seal{display:none}
}
@media (max-width:420px){.tiles{grid-template-columns:minmax(0,1fr)}.filters label{flex:1 1 140px}.filters select{min-width:0;width:100%}}
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,18,10,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal-box{background:var(--card);color:var(--fg);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3);width:min(820px,100%);display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
#edform{display:flex;flex-direction:column;min-height:0;max-height:inherit}
.mhead{display:flex;gap:12px;align-items:flex-start;padding:18px 22px;background:var(--sun);color:var(--sun-ink);border-radius:8px 8px 0 0}
.mhead small{font-size:13px;opacity:.8}.mhead h2{font-size:21px}
.mclose{margin-left:auto;background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:inherit;padding:0 4px}
.mbody{padding:16px 22px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.mbody fieldset{border:1px solid var(--line);border-radius:6px;padding:12px 14px 14px;margin:0}
.mbody legend{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:0 6px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld.wide{grid-column:1/-1}
.fld input,.fld select{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
.fld input:focus,.fld select:focus{border-color:var(--sun-deep);outline:2px solid var(--sun);outline-offset:0}
.mfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 22px;border-top:1px solid var(--line)}
.err{background:var(--bad-bg);color:var(--bad);padding:8px 12px;border-radius:4px;margin:0}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.btn.ed{background:var(--card);color:var(--fg)}
@media (max-width:600px){.fgrid{grid-template-columns:minmax(0,1fr)}.mhead,.mbody,.mfoot{padding-left:14px;padding-right:14px}.modal{padding-top:max(8px,env(safe-area-inset-top,0px))}.modal-box{max-height:calc(100vh - 16px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Padrão visual do Painel Financeiro: azul-marinho + dourado, cartões brancos ===== */
:root{
  --navy:#1B2A4A; --navy-2:#24365C; --gold:#E3A72F; --gold-soft:#F6C453; --gold-ink:#1B2A4A;
  --bg:#F3F5F8; --panel:#FFFFFF; --card:#FFFFFF; --fg:#1B2433; --muted:#5B6576; --line:#E1E5EC; --soft:#F6F8FB;
  --ok:#1F7A4D; --ok-bg:#E7F7EE; --info:#24365C; --info-bg:#E8EDF6;
  --display:"Inter",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#16223D; --navy-2:#22335A; --gold:#E3A72F; --gold-soft:#F6C453; --gold-ink:#16223D;
  --bg:#0E1424; --panel:#162036; --card:#162036; --fg:#E7EBF2; --muted:#9AA6BA; --line:#26324B; --soft:#1B2740;
  --info:#A9C1EA; --info-bg:#1E2B47; --shadow:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{
  --navy:#16223D; --navy-2:#22335A; --gold:#E3A72F; --gold-soft:#F6C453; --gold-ink:#16223D;
  --bg:#0E1424; --panel:#162036; --card:#162036; --fg:#E7EBF2; --muted:#9AA6BA; --line:#26324B; --soft:#1B2740;
  --info:#A9C1EA; --info-bg:#1E2B47; --shadow:0 1px 3px rgba(0,0,0,.4)}
body{font-size:15px}
body::before{background:var(--navy)}
h1,h2,h3{font-weight:700;letter-spacing:-.01em}
/* cabeçalho */
.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);box-shadow:none;min-height:92px;padding-block:14px;gap:18px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{width:56px;height:56px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#B9C6E0}
.ttl{font-size:22px;font-weight:800;letter-spacing:-.015em;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.gpill{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-soft);border:1.5px solid var(--gold);border-radius:99px;padding:3px 11px;white-space:nowrap}
.top .search{max-width:380px}
.top input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px}
.top input::placeholder{color:#C3CDE0}
.top .search svg{color:#fff}
.burger{color:#fff}
.seal{display:none}
/* menu lateral */
.side{background:var(--card);color:var(--fg);border-right:1px solid var(--line)}
.who{background:var(--navy);color:#fff;min-height:92px;border-bottom:3px solid var(--gold);box-shadow:none}
.who small{color:#B9C6E0;opacity:1;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.who svg{color:var(--gold-soft)}
.nav{padding:16px 12px}
.nav a{font-size:15px;font-weight:500;border-radius:10px;color:var(--fg)}
.nav a:hover{background:var(--soft)}
.nav a[aria-current="page"]{background:var(--navy);color:#fff;font-weight:600}
.nav .count{background:var(--gold);color:var(--gold-ink);font-weight:700}
.nav a[aria-current="page"] .count{background:var(--gold-soft)}
/* painéis e cartões */
main{padding-block:22px 48px;padding-left:24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:20px 24px;border-bottom:1px solid var(--line)}
.panel-head h1{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.panel-body{padding:22px 24px}
.card,.kpi,.tbl-wrap{border-radius:12px;box-shadow:var(--shadow)}
.card h3{color:var(--navy);font-weight:800;letter-spacing:.08em}
.kpi{border-top:3px solid var(--gold)}
.kpi b{font-weight:800;color:var(--navy)}
.kpi span{font-weight:700;letter-spacing:.08em;font-size:12px}
/* botões */
.btn{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);font-weight:600;padding:10px 18px}
.btn:hover{filter:none;border-color:var(--navy-2)}
.btn.y{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.y:hover{background:var(--navy-2)}
.btn.ed{background:var(--card);color:var(--fg)}
/* blocos-atalho */
.tiles{gap:16px}
.tile{background:var(--card);color:var(--fg);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;box-shadow:var(--shadow);align-items:flex-start;text-align:left;padding:18px 20px;min-height:96px}
.tile:hover{transform:translateY(-2px);border-color:var(--navy-2);border-left-color:var(--gold)}
.tile span.t{text-decoration:none;font-weight:700;font-size:16px;color:var(--navy)}
.tile span.t svg{color:var(--gold)}
.tile small{color:var(--muted);opacity:1;font-size:13px}
/* tabelas e filtros */
th{background:var(--soft);color:var(--muted);font-weight:700;letter-spacing:.07em}
tbody tr:hover{background:var(--soft)}
tfoot td{background:var(--soft)}
.filters label{font-weight:700;letter-spacing:.08em}
.filters select,.filters input{border-radius:10px;padding:9px 12px;background:var(--card)}
.bar{background:var(--soft)}
.bar i{background:var(--gold)}
.avatar{background:var(--navy);color:var(--gold-soft)}
.idhead h1{font-weight:800;color:var(--navy)}
.results a:hover,.results a.sel{background:var(--soft)}
/* janela de edição */
.mhead{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);border-radius:12px 12px 0 0}
.mhead small{color:#B9C6E0;opacity:1}
.modal-box{border-radius:12px}
.fld input,.fld select{border-radius:8px;background:var(--soft)}
.fld input:focus,.fld select:focus{border-color:var(--navy-2);outline:2px solid var(--gold-soft)}
.toast{background:var(--navy);color:#fff}

const nrm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const dig = s => String(s||'').replace(/\D/g,'');
function pendAtiva(m, n){
  const nac = m.nac || {};
  let x;
  if (n === 'Não encontrado no Cadastro Nacional') return !nac.matricula;
  if ((x = n.match(/^Cônjuge sem cadastro próprio: (.+)$/))) return !!(m.conj && nrm(m.conj.nome) === nrm(x[1]) && !m.conj.matricula);
  if ((x = n.match(/^Auxiliar sem Cadastro Nacional: (.+)$/))) return (m.aux||[]).flatMap(a => [a, a.conjRec]).some(a => a && nrm(a.nome) === nrm(x[1]) && !a.matricula);
  if ((x = n.match(/^Jurisdição no Cadastro Nacional: (.+?) \(não está/))) return nrm(nac.jurisdicao) === nrm(x[1]);
  if (/^Endereço do cadastro \(rua e CEP\) ainda é de Manaus/.test(n)) return nac.cep != null && nac.cep !== '' ? /^69/.test(dig(nac.cep)) : !!nac._cep69;
  if ((x = n.match(/^CNPJ igual ao de (.+)$/))) { const o = DATA.find(y => nrm(y.nome) === nrm(x[1])); return !!(o && dig(o.cnpj) && dig(o.cnpj) === dig(m.cnpj)); }
  return true;
}
function pendList(m){ const a = m.notas.filter(n => pendAtiva(m, n)); if (m.terreno === 'Verificar') a.push('Terreno: ' + m.terrenoDet); return a; }

/* ---------- table ---------- */
const TABLES = {};
function table(key, def){
  const [sk, sd] = state.sort[key] || def.sort || [def.cols[0][0], 1];
  const col = def.cols.find(c=>c[0]===sk);
  const val = (m,c) => c[4] ? c[4](m) : m[c[0]];
  let rows = [...def.rows()];
  if (col) rows.sort((a,b)=>{ let x=val(a,col), y=val(b,col); if(c_num(col)) return ((x??-1)-(y??-1))*sd; return norm(x??'').localeCompare(norm(y??''),'pt')*sd || ((a.ord||0)-(b.ord||0)); });
  TABLES[key] = { def, rows };
  const head = def.cols.map(c=>`<th class="${c[2]?'num':''}" data-sort="${key}|${c[0]}" aria-sort="${c[0]===sk?(sd>0?'ascending':'descending'):'none'}">${c[1]}${c[0]===sk?(sd>0?' ▲':' ▼'):''}</th>`).join('');
  const body = rows.map(m=>`<tr>${def.cols.map(c=>`<td class="${c[2]?'num':''}">${c[3]?c[3](m):c[2]?fmtN(m[c[0]]):esc(m[c[0]])}</td>`).join('')}</tr>`).join('');
  const foot = def.foot ? `<tfoot><tr>${def.foot(rows).map((v,i)=>`<td class="${def.cols[i][2]?'num':''}">${v}</td>`).join('')}</tr></tfoot>` : '';
  return `<div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`;
}
function c_num(c){ return !!c[2]; }
function tableTSV(key){
  const { def, rows } = TABLES[key];
  const txt = c => (s => String(s ?? '').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim())(c);
  const lines = [def.cols.map(c=>c[1]).join('\t')].concat(rows.map(m=>def.cols.map(c=>c[4]!==undefined&&c[4]!==null?txt(c[4](m)):c[3]?txt(c[3](m)):txt(m[c[0]])).join('\t')));
  return lines.join('\n');
}

const pk = (r, n) => r && r.matricula ? 'mat-' + r.matricula.replace(/[^0-9A-Za-z]/g, '') : 'nome-' + slug(n || 'sem-nome');
function assignKeys(d){
  d.P.forEach(m => {
    m._key = 'ig-' + slug(m.igreja);
    m._tk = pk(m.nac, m.nome);
    if (m.conj) { m._ck = pk(m.conj, m.conj.nome); m.conj._k = m._ck; }
    (m.aux||[]).forEach(a => { a._k = pk(a, a.nome); if (a.conjRec) a.conjRec._k = pk(a.conjRec, a.conjRec.nome); });
  });
}
function findTarget(key){
  for (const m of DATA) {
    if (m._key === key) return { kind:'igreja', m, label:m.igreja };
    if (m._tk === key) return { kind:'pessoa', m, role:'titular', r:m.nac, label:m.nome };
    if (m.conj && m._ck === key) return { kind:'pessoa', m, role:'conjuge', r:m.conj, label:m.conj.nome };
    for (const a of (m.aux||[])) {
      if (a._k === key) return { kind:'pessoa', m, role:'auxiliar', r:a, label:a.nome };
      if (a.conjRec && a.conjRec._k === key) return { kind:'pessoa', m, role:'auxiliar', r:a.conjRec, label:a.conjRec.nome };
    }
  }
  return null;
}
const NUMF = ['membros','lideres'];
function applyOne(key, f){
  const t = findTarget(key); if (!t || !f) return;
  if (t.kind === 'igreja') {
    const m = t.m;
    for (const [k,v] of Object.entries(f)) m[k] = NUMF.includes(k) ? (v === '' || v == null ? 0 : +v) : (v === '' && k === 'inicio' ? null : v);
    if (f.cnpj) m.cnpjNota = null; else if (!m.cnpjNota) m.cnpjNota = 'Não informado';
    m._editado = 1; return;
  }
  let r = t.r;
  if (!r && t.role === 'titular') { r = t.m.nac = { fonte:'Editado na Secretaria' }; }
  for (const [k,v] of Object.entries(f)) r[k] = (k === 'nasc' || k === 'inclusao') && !v ? null : v;
  r._editado = 1;
  if (t.role === 'titular') {
    if (f.nome) t.m.nome = f.nome;
    if ('email' in f) t.m.email = f.email;
    if (f.matricula) t.m.notas = t.m.notas.filter(n => n !== 'Não encontrado no Cadastro Nacional');
  }
}

  deriveA(); deriveB(); deriveC(); deriveD();
}

  const id = 'ed-' + k;
  let ctl;
  if (type === 'select') { const o = optsL.includes(v) || v === '' ? optsL : [v, ...optsL]; ctl = `<select id="${id}" name="${k}"><option value="">—</option>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`; }
  else ctl = `<input id="${id}" name="${k}" type="${type}" value="${esc(v)}" ${type==='number'?'min="0" step="1" inputmode="numeric"':''} autocomplete="off">`;
  return `<label class="fld${wide?' wide':''}" for="${id}"><span>${label}</span>${ctl}</label>`;
}
async function openEditor(key){
  const t = findTarget(key); if (!t) { toast('Não encontrei esse cadastro'); return; }
  EDKEY = key; EDLAST = document.activeElement;
  const src = t.kind === 'igreja' ? t.m : (t.r || {});
  const vals = t.kind === 'pessoa' && t.role === 'titular' ? { ...src, nome: t.m.nome, email: (src.email || t.m.email) } : src;
  const groups = t.kind === 'igreja' ? IFIELDS : PFIELDS;
  const roleTxt = t.kind === 'igreja' ? 'Dados da igreja' : ({titular:'Titular', conjuge:'Cônjuge', auxiliar:'Auxiliar'})[t.role] + ' · ' + t.m.igreja;
  const ov = OVR[key];
  let quem = '';
  if (ov && ov.updatedAt) {
    let nome = '';
    try { if (USER && ov.by) { const ps = await USER.profiles([ov.by]); nome = ps[ov.by] && ps[ov.by].name || ''; } } catch(e) {}
    quem = `Última alteração em ${new Date(ov.updatedAt).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}${nome ? ' por ' + esc(nome) : ''}.`;
  }
  $('#modal-box').innerHTML = `<form id="edform" novalidate>
    <div class="mhead"><div style="min-width:0"><small>${esc(roleTxt)}</small><h2 id="modal-title">Editar ${esc(t.label)}</h2></div><button type="button" class="mclose" data-close aria-label="Fechar">×</button></div>
    <div class="mbody">${groups.map(([g, fs]) => `<fieldset><legend>${g}</legend><div class="fgrid">${fs.map(f => fieldHTML(f, vals[f[0]])).join('')}</div></fieldset>`).join('')}
    ${quem ? `<p class="muted" style="margin:0;font-size:13px">${quem}</p>` : ''}<p class="err" id="ed-err" hidden></p></div>
    <div class="mfoot"><span style="flex:1"></span><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn y" id="ed-save">Salvar alterações</button></div>
  </form>`;
  $('#modal').hidden = false; document.body.style.overflow = 'hidden';
  const first = $('#modal-box input, #modal-box select'); if (first) first.focus();
}
function closeEditor(){
  $('#modal').hidden = true; document.body.style.overflow = ''; EDKEY = null;
  if (EDLAST && EDLAST.focus) try { EDLAST.focus(); } catch(e) {}
}
async function saveEditor(e){
  e.preventDefault();
  const t = findTarget(EDKEY); if (!t || !DB) return;
  const fd = new FormData($('#edform')); const fields = {};
  for (const [k,v] of fd.entries()) fields[k] = String(v).trim();
  const err = $('#ed-err');
  if (t.kind === 'pessoa' && !fields.nome) { err.textContent = 'Preencha o nome completo.'; err.hidden = false; $('#ed-nome').focus(); return; }
  if (t.kind === 'igreja' && !fields.igreja) { err.textContent = 'Preencha o nome da igreja.'; err.hidden = false; $('#ed-igreja').focus(); return; }
  const d = fields.cpf ? fields.cpf.replace(/\D/g,'') : '';
  if (d.length === 11 && !/[.-]/.test(fields.cpf)) fields.cpf = `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
  const btn = $('#ed-save'); btn.disabled = true; btn.textContent = 'Salvando…';
  const key = EDKEY;
  const doc = { kind:t.kind, nome:(t.kind==='igreja'?fields.igreja:fields.nome), fields, updatedAt:new Date().toISOString(), by:MYID || '' };
  try {
    await DB.collection('edicoes').doc(key).set(doc);
    OVR[key] = doc; applyAll(); closeEditor(); rerender(); toast('Alterações salvas');
  } catch(ex) {
    btn.disabled = false; btn.textContent = 'Salvar alterações';
    err.textContent = ex && ex.code === 'permission_denied' ? 'Você não tem permissão para editar. Peça acesso de edição ao dono da página.' : 'Não foi possível salvar agora. Verifique a conexão e tente de novo.';
    err.hidden = false;
  }
}
const editBtn = (k, label) => EDIT && k ? `<button class="btn ed" type="button" data-edit="${esc(k)}">${icon('pen',16)} ${label}</button>` : '';
document.addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'); if (ed) { e.preventDefault(); openEditor(ed.dataset.edit); return; }
  if (e.target.closest('[data-close]') || e.target.id === 'modal') { closeEditor(); return; }
});
document.addEventListener('submit', e => { if (e.target.id === 'edform') saveEditor(e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeEditor(); });

async function initDb(){
  try { const r = await fetch('edicoes.json?v=' + Date.now(), {cache:'no-store'}); if (r.ok) { OVR = await r.json(); applyAll(); rerender(); } } catch(e) {}
  return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    DB = db; USER = user;
    if (user) { try { MYID = await user.id(); } catch(e) {} try { EDIT = !!db && await user.canEdit(); } catch(e) { EDIT = false; } }
    if (!db) { rerender(); return; }
    db.collection('edicoes').onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); });
      OVR = o; applyAll(); rerender();
    }, () => { toast('As alterações salvas não puderam ser carregadas agora'); });
    rerender();
  } catch(e) {}
}

applyAll();
route();
initDb();
</script>

</body>
